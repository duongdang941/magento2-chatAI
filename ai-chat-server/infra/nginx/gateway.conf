map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=afd_ai_connection_rate:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=afd_ai_connection_limit:10m;

upstream afd_ai_gateway_replicas {
    least_conn;
    server gateway-1:3001 max_fails=3 fail_timeout=15s;
    server gateway-2:3001 max_fails=3 fail_timeout=15s;
    server gateway-3:3001 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 6m;

    location = /health {
        proxy_pass http://afd_ai_gateway_replicas;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        limit_req zone=afd_ai_connection_rate burst=12 nodelay;
        limit_conn afd_ai_connection_limit 12;

        proxy_pass http://afd_ai_gateway_replicas;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 3600s;
    }
}
